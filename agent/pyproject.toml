[project]
name = "babakoto-agent"
version = "0.0.0"
description = "LiveKit Agents worker for Babakoto"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "httpx>=0.27",
  "livekit-agents[anthropic,gladia,google,openai,silero]~=1.8",
  "pydantic-settings>=2.6",
  "python-dotenv>=1.2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/babakoto_agent"]
