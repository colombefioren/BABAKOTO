[project]
name = "babakoto-common"
version = "0.0.0"
description = "Shared building blocks for Babakoto services"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["starlette>=0.40"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/babakoto_common"]
