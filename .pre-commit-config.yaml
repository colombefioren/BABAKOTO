repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1024']
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  # Local hooks reuse the versions pinned in uv.lock and pnpm-lock.yaml.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy --strict
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
        args: [api/src, packages/malagasy-text/src, agent/src, services/stt/src, services/tts/src, training/asr/src, training/tts/src, eval/src]
      - id: prettier
        name: prettier
        entry: pnpm exec prettier --write --ignore-unknown
        language: system
        types_or: [markdown, json, yaml, ts, javascript]
      - id: eslint
        name: eslint
        entry: pnpm --filter babakoto-web lint
        language: system
        files: ^web/.*\.(ts|tsx|js)$
        pass_filenames: false
