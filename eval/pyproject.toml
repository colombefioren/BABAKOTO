[project]
name = "babakoto-eval"
version = "0.0.0"
description = "Evaluation and benchmark scripts"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "babakoto-agent",
  "httpx>=0.27",
]

[project.optional-dependencies]
asr = ["babakoto-stt[sunflower]", "babakoto-training-asr"]

[tool.uv.sources]
babakoto-agent = { workspace = true }
babakoto-stt = { workspace = true }
babakoto-training-asr = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/babakoto_eval"]
