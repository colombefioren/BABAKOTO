[project]
name = "babakoto"
version = "0.0.0"
description = "Open-source real-time voice agents that understand and speak Malagasy"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[dependency-groups]
dev = [
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "httpx>=0.27",
  "ruff>=0.8",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "packages/common",
  "packages/malagasy-text",
  "agent",
  "api",
  "services/stt",
  "services/tts",
  "training/asr",
  "training/tts",
  "eval",
]

[tool.uv.sources]
babakoto-common = { workspace = true }
babakoto-malagasy-text = { workspace = true }
babakoto-agent = { workspace = true }
babakoto-api = { workspace = true }
babakoto-stt = { workspace = true }
babakoto-tts = { workspace = true }
babakoto-training-asr = { workspace = true }
babakoto-training-tts = { workspace = true }
babakoto-eval = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["packages/common/src", "packages/malagasy-text/src", "agent/src", "api/src", "services/stt/src", "services/tts/src", "training/asr/src", "training/tts/src", "eval/src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]
"packages/malagasy-text/**" = ["RUF001"]  # curly quotes and NBSP are test inputs

[tool.mypy]
strict = true
python_version = "3.11"
explicit_package_bases = true
files = ["packages/common/src", "packages/malagasy-text/src", "agent/src", "api/src", "services/stt/src", "services/tts/src", "training/asr/src", "training/tts/src", "eval/src"]
mypy_path = ["packages/common/src", "packages/malagasy-text/src", "agent/src", "api/src", "services/stt/src", "services/tts/src", "training/asr/src", "training/tts/src", "eval/src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["torch", "transformers", "torch.*", "transformers.*", "huggingface_hub", "omnivoice"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["packages/common/tests", "packages/malagasy-text/tests", "agent/tests", "api/tests", "services/stt/tests", "services/tts/tests", "training/asr/tests", "training/tts/tests", "eval/tests"]
addopts = "-ra --import-mode=importlib"

[tool.coverage.run]
source = ["packages/common/src", "packages/malagasy-text/src", "agent/src", "api/src", "services/stt/src", "services/tts/src", "training/asr/src", "training/tts/src", "eval/src"]
branch = true

[tool.coverage.report]
show_missing = true
