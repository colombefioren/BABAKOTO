name: Bug report
description: Something is broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Do not paste secrets or real user recordings or transcripts.
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations: { required: true }
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, GPU, providers in use, Babakoto version or commit
