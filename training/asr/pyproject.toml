[project]
name = "babakoto-training-asr"
version = "0.0.0"
description = "ASR data pipeline and fine-tuning"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
train = ["accelerate>=1.0", "numpy>=2.0", "peft>=0.19", "torch>=2.5", "transformers>=5.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/babakoto_training_asr"]
